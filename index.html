<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hannas Workout</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🏋️ Hannas Workout</h1>

        <!-- INSTÄLLNINGAR -->
        <section id="settings">

            <div class="mode-buttons">
                <button id="standardModeButton" class="mode-button active">
                    Standard
                </button>

                <button id="stairModeButton" class="mode-button">
                    🪜 Trappa
                </button>
            </div>


            <!-- STANDARDLÄGE -->
            <div id="standardSettings">

                <label for="interval">
                    Intervall
                </label>

                <select id="interval">
                    <option value="20">00:20</option>
                    <option value="40">00:40</option>
                    <option value="60" selected>01:00</option>
                    <option value="80">01:20</option>
                    <option value="100">01:40</option>
                    <option value="120">02:00</option>
                    <option value="140">02:20</option>
                    <option value="160">02:40</option>
                    <option value="180">03:00</option>
                </select>


                <label for="rest">
                    Vila mellan intervaller
                </label>

                <select id="rest">
                    <option value="20">00:20</option>
                    <option value="40" selected>00:40</option>
                    <option value="60">01:00</option>
                    <option value="80">01:20</option>
                    <option value="100">01:40</option>
                    <option value="120">02:00</option>
                    <option value="140">02:20</option>
                    <option value="160">02:40</option>
                    <option value="180">03:00</option>
                </select>


                <label for="repetitions">
                    Antal intervaller
                </label>

                <select id="repetitions">
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5" selected>5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                </select>

            </div>


            <!-- TRAPP-LÄGE -->
            <div id="stairSettings" class="hidden">

                <label for="stairCount">
                    Antal intervaller
                </label>

                <select id="stairCount">
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5" selected>5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                </select>


                <div id="stairIntervals"></div>


                <label for="stairRest">
                    Vila mellan intervaller
                </label>

                <select id="stairRest">
                    <option value="20">00:20</option>
                    <option value="40" selected>00:40</option>
                    <option value="60">01:00</option>
                    <option value="80">01:20</option>
                    <option value="100">01:40</option>
                    <option value="120">02:00</option>
                    <option value="140">02:20</option>
                    <option value="160">02:40</option>
                    <option value="180">03:00</option>
                </select>

            </div>


            <button id="startButton" class="start-button">
                ▶ STARTA
            </button>

        </section>


        <!-- TIMER -->
        <section id="timerSection" class="hidden">

            <div id="phaseDisplay" class="phase">
                INTERVALL
            </div>

            <div id="timerDisplay">
                01:00
            </div>

            <div id="repetitionDisplay">
                Intervall 1 / 5
            </div>

            <button id="stopButton" class="stop-button">
                ■ STOPPA
            </button>

        </section>


        <!-- KLAR -->
        <section id="finishedSection" class="hidden">

            <div class="finished">
                <div class="finished-icon">🎉</div>
                <h2>KLAR!</h2>
                <p>Bra jobbat!</p>
            </div>

            <button id="againButton" class="start-button">
                🔄 KÖR IGEN
            </button>

        </section>

    </div>


    <script src="app.js"></script>

</body>
</html>
