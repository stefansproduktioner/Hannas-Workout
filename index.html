<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intervallträning</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <h1>Intervallträning</h1>
        <p class="subtitle">Ställ in ditt träningspass</p>

        <div class="settings">

            <div class="setting">
                <label for="intervalTime">
                    Hur lång intervall vill du ha?
                </label>

                <select id="intervalTime">
                    <option value="1">1 minut</option>
                    <option value="2">2 minuter</option>
                    <option value="3">3 minuter</option>
                    <option value="4">4 minuter</option>
                    <option value="5">5 minuter</option>
                    <option value="6">6 minuter</option>
                    <option value="7">7 minuter</option>
                    <option value="8">8 minuter</option>
                    <option value="9">9 minuter</option>
                    <option value="10">10 minuter</option>
                </select>
            </div>


            <div class="setting">
                <label for="restTime">
                    Hur lång vila vill du ha?
                </label>

                <select id="restTime">
                    <option value="0.5">0,5 minuter</option>
                    <option value="1">1 minut</option>
                    <option value="1.5">1,5 minuter</option>
                    <option value="2">2 minuter</option>
                    <option value="2.5">2,5 minuter</option>
                    <option value="3">3 minuter</option>
                </select>
            </div>


            <div class="setting">
                <label for="repetitions">
                    Hur många gånger vill du repetera?
                </label>

                <select id="repetitions">
                    <option value="2">2 gånger</option>
                    <option value="3">3 gånger</option>
                    <option value="4">4 gånger</option>
                    <option value="5">5 gånger</option>
                    <option value="6">6 gånger</option>
                    <option value="7">7 gånger</option>
                    <option value="8">8 gånger</option>
                    <option value="9">9 gånger</option>
                    <option value="10">10 gånger</option>
                </select>
            </div>

        </div>


        <button id="startButton">STARTA TRÄNING</button>


        <div id="timerSection" class="timer-section">

            <div id="phase">Redo?</div>

            <div id="timer">00:00</div>

            <div id="repetition">
                Repetition 0 / 0
            </div>

            <button id="stopButton">STOPPA</button>

        </div>

    </div>


    <script src="app.js"></script>

</body>
</html>
